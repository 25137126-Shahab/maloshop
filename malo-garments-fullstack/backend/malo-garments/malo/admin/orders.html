<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — Malo Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="./css/admin.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
</head>
<body>

  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar"></aside>

    <div class="admin-main">
      <div class="admin-topbar" id="adminTopbar"></div>

      <div class="admin-content">
        <div class="admin-card">
          <div class="admin-card-header">
            <div class="admin-toolbar">
              <input type="text" class="admin-search-input" id="orderSearch" placeholder="Search by order ID or customer..." />
              <select class="form-select" id="statusFilterSelect" style="width:auto;">
                <option value="">All Statuses</option>
                <option value="Pending">Pending</option>
                <option value="Processing">Processing</option>
                <option value="Shipped">Shipped</option>
                <option value="Delivered">Delivered</option>
                <option value="Cancelled">Cancelled</option>
              </select>
            </div>
          </div>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr><th>Order ID</th><th>Customer</th><th>Date</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Actions</th></tr>
              </thead>
              <tbody id="ordersTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Order Detail Modal -->
  <div class="admin-modal-overlay" id="orderModalOverlay">
    <div class="admin-modal">
      <div class="admin-modal-header">
        <h3>Order Details</h3>
        <button class="admin-modal-close" id="closeOrderModal">✕</button>
      </div>
      <div id="orderModalBody"></div>
    </div>
  </div>

  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
  <script src="./js/admin-common.js"></script>
  <script src="./js/orders.js"></script>
</body>
</html>
