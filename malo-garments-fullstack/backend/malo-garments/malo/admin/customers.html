<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers — Malo Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="./css/admin.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
</head>
<body>

  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar"></aside>

    <div class="admin-main">
      <div class="admin-topbar" id="adminTopbar"></div>

      <div class="admin-content">
        <div class="admin-card">
          <div class="admin-card-header">
            <div class="admin-toolbar">
              <input type="text" class="admin-search-input" id="customerSearch" placeholder="Search customers..." />
            </div>
          </div>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th><th>Orders</th><th>Total Spent</th><th></th></tr>
              </thead>
              <tbody id="customersTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Customer Detail Modal -->
  <div class="admin-modal-overlay" id="customerModalOverlay">
    <div class="admin-modal">
      <div class="admin-modal-header">
        <h3 id="customerModalTitle">Customer Details</h3>
        <button class="admin-modal-close" id="closeCustomerModal">✕</button>
      </div>
      <div id="customerModalBody"></div>
    </div>
  </div>

  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
  <script src="./js/admin-common.js"></script>
  <script src="./js/customers.js"></script>
</body>
</html>
