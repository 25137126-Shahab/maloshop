<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Product — Malo Garments</title>
  <meta name="description" content="Shop premium ladies garments and undergarments at Malo Garments." />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/product.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
</head>
<body>

  <header id="main-navbar"></header>

  <main class="main-content" style="padding-top: 0;">
    <section class="page-header" style="padding: var(--sp-xl) 0;">
      <div class="container">
        <div class="breadcrumb" id="breadcrumb" style="justify-content: flex-start;">
          <a href="../index.html">Home</a>
          <span class="separator">/</span>
          <a href="./shop.html">Shop</a>
          <span class="separator">/</span>
          <span class="current" id="breadcrumbCurrent">Product</span>
        </div>
      </div>
    </section>

    <div class="container">
      <div class="product-detail">
        <div class="product-detail-grid" id="productDetailGrid">
          <!-- Rendered by JS -->
        </div>

        <!-- Tabs -->
        <div class="product-tabs" id="productTabs">
          <!-- Rendered by JS -->
        </div>
      </div>

      <!-- Related Products -->
      <section class="related-products">
        <div class="section-header animate-on-scroll">
          <span class="section-subtitle">You May Also Like</span>
          <h2 class="section-title">Related Products</h2>
          <hr class="section-divider" />
        </div>
        <div class="product-grid" id="relatedGrid"></div>
      </section>
    </div>
  </main>

  <footer id="main-footer"></footer>

  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/product.js"></script>

</html>
