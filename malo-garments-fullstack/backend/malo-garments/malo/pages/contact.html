<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — Malo Garments</title>
  <meta name="description" content="Get in touch with Malo Garments — questions, order support, and feedback." />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
</head>
<body>

  <header id="main-navbar"></header>

  <section class="page-header">
    <div class="container">
      <h1>Contact Us</h1>
      <div class="breadcrumb" style="justify-content: center;">
        <a href="../index.html">Home</a>
        <span class="separator">/</span>
        <span class="current">Contact</span>
      </div>
    </div>
  </section>

  <main class="main-content" style="padding-top: 0;">
    <div class="container">
      <div class="contact-layout">
        <div class="contact-info-card animate-on-scroll">
          <h3 style="font-family: var(--font-heading); font-size: var(--fs-xl); margin-bottom: var(--sp-xl);">Get in Touch</h3>

          <div class="contact-info-item">
            <div class="contact-info-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <div>
              <h4>Store Address</h4>
              <p>12-B Gulberg Boulevard, Lahore, Punjab, Pakistan</p>
            </div>
          </div>

          <div class="contact-info-item">
            <div class="contact-info-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </div>
            <div>
              <h4>Phone</h4>
              <p>+92 300 1234567</p>
            </div>
          </div>

          <div class="contact-info-item">
            <div class="contact-info-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </div>
            <div>
              <h4>Email</h4>
              <p>hello@malogarments.com</p>
            </div>
          </div>

          <div class="contact-info-item">
            <div class="contact-info-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div>
              <h4>Working Hours</h4>
              <p>Mon – Sat: 10:00 AM – 9:00 PM</p>
            </div>
          </div>

          <div class="contact-map">
            <iframe src="https://www.google.com/maps?q=Gulberg%2C%20Lahore%2C%20Pakistan&output=embed" loading="lazy" title="Malo Garments Location"></iframe>
          </div>
        </div>

        <div class="contact-form-card animate-on-scroll delay-1">
          <h3 style="font-family: var(--font-heading); font-size: var(--fs-xl); margin-bottom: var(--sp-sm);">Send Us a Message</h3>
          <p style="font-size: var(--fs-sm); color: var(--text-light); margin-bottom: var(--sp-xl);">We usually respond within 24 hours.</p>

          <form id="contactForm" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Your Name *</label>
                <input type="text" class="form-input" id="contactName" required />
                <div class="form-error" id="err-contactName"></div>
              </div>
              <div class="form-group">
                <label class="form-label">Email Address *</label>
                <input type="email" class="form-input" id="contactEmail" required />
                <div class="form-error" id="err-contactEmail"></div>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Subject</label>
              <input type="text" class="form-input" id="contactSubject" placeholder="Order inquiry, feedback, etc." />
            </div>
            <div class="form-group">
              <label class="form-label">Message *</label>
              <textarea class="form-textarea" id="contactMessage" required placeholder="How can we help you?"></textarea>
              <div class="form-error" id="err-contactMessage"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-block">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer id="main-footer"></footer>

  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/contact.js"></script>
</body>
</html>
