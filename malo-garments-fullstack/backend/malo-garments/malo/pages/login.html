<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login or Sign Up — Malo Garments</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/auth.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
</head>
<body>

  <header id="main-navbar"></header>

  <main class="main-content">
    <div class="container">
      <div class="auth-wrapper">
        <div class="auth-card">
          <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">Login</button>
            <button class="auth-tab" data-tab="signup">Sign Up</button>
          </div>

          <!-- Login Form -->
          <form class="auth-form active" id="loginForm" novalidate>
            <h2 class="auth-form-title">Welcome Back</h2>
            <p class="auth-form-subtitle">Log in to access your orders and saved addresses.</p>

            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-input" id="loginEmail" required />
              <div class="form-error" id="err-loginEmail"></div>
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input type="password" class="form-input" id="loginPassword" required />
              <div class="form-error" id="err-loginPassword"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-block">Log In</button>
            <p style="text-align:center; margin-top: var(--sp-lg); font-size: var(--fs-xs); color: var(--text-muted);">
              Demo tip: sign up first to create an account — there are no pre-seeded customer logins.
            </p>
          </form>

          <!-- Signup Form -->
          <form class="auth-form" id="signupForm" novalidate>
            <h2 class="auth-form-title">Create Your Account</h2>
            <p class="auth-form-subtitle">Join Malo Garments for a faster checkout experience.</p>

            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-input" id="signupName" required />
              <div class="form-error" id="err-signupName"></div>
            </div>
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-input" id="signupEmail" required />
              <div class="form-error" id="err-signupEmail"></div>
            </div>
            <div class="form-group">
              <label class="form-label">Phone Number</label>
              <input type="tel" class="form-input" id="signupPhone" placeholder="03XX-XXXXXXX" />
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input type="password" class="form-input" id="signupPassword" required />
              <div class="password-strength" id="passwordStrength">
                <div class="password-strength-bar"></div>
                <div class="password-strength-bar"></div>
                <div class="password-strength-bar"></div>
              </div>
              <div class="form-error" id="err-signupPassword"></div>
            </div>
            <div class="form-group">
              <label class="form-label">Confirm Password</label>
              <input type="password" class="form-input" id="signupConfirmPassword" required />
              <div class="form-error" id="err-signupConfirmPassword"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-block">Create Account</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer id="main-footer"></footer>

  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
